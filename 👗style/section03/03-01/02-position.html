<!DOCTYPE html>
<html lang="en">
<head>
    <title>포지션 상대위치 실습</title>
    <style>
        .상자{
            width: 200px;
            height: 200px;
            background-color: skyblue;
        }

        .삭제버튼{
            position: relative;
            top: 20px;
            left: 20px;
        }

        .X버튼{
            position: relative;
            top: -190px;
            right: -120px;
        }

    </style>
</head>
<body>
    <div class="상자"></div>
    <button class="삭제버튼">삭제</button>
    <button class="X버튼">X</button>

</body>
</html>
