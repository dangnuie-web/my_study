<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엑센트컬러 예제</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
        }

        .btn {
            display: flex;
            flex-direction: row;
        }

        .체크박스 {
            accent-color: lime; 
            /* background-color: lime; */ 
            /* 이러한 태그들의 배경색을 바꾸는 것은 불가능해요. 하지만 accent-color를 사용하면 체크박스의 색상을 바꿀 수 있다. */
        }
        .라디오버튼 {
            accent-color: orangered;
        }
        .크기조절바 {
            accent-color: gold;
            width: 100px;
        }
        .프로그레스바 {
            accent-color: deepskyblue;
            width: 100px;
        }
    </style>
</head>
<body>
    <div class="btn">
        <input type="checkbox" class="체크박스" />
        <input type="radio" class="라디오버튼" />
    </div>
    <input type="range" max="100" value="70" class="크기조절바"/>
    <progress max="100" value="70" class="프로그레스바"></progress>
</body>
</html>
