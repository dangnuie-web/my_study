<!DOCTYPE html>
<html lang="ko">
<head>
    <title>Dot</title>
    <style>
        /* 점들을 가로로 배치 */
    .loading{

        display:flex;

        gap:10px;

    }

    /* 각각의 점 */
    .loading span{

        width:15px;
        height:15px;

        background:dodgerblue;

        border-radius:50%;

        animation:bounce 0.6s infinite alternate;

    }

    /* 두 번째 점은 조금 늦게 시작 */
    .loading span:nth-child(2){

        animation-delay:0.2s;

    }

    /* 세 번째 점도 조금 늦게 시작 */
    .loading span:nth-child(3){

        animation-delay:0.4s;

    }

    /* 위아래로 움직이는 애니메이션 */
    @keyframes bounce{

        from{

            transform:translateY(0);

        }

        to{

            transform:translateY(-12px);

        }

    }

        
    </style>
</head>
<body>
    <div class="loading">
    <span></span>
    <span></span>
    <span></span>
</div>
</body>
</html>
