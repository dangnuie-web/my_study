<!DOCTYPE html>
<html lang="ko">
<head>
    <title>skeleton 로딩 실습</title>
    <style>
        /* 카드 */
    .card{

        width:300px;
        padding:20px;

    }

    /* 이미지 자리 */
    .image{
        width:100%;
        height:150px;
        background:#ddd;
        animation:shimmer 1.5s infinite;
    }

    /* 제목 자리 */
    .title{
        width:70%;
        height:20px;
        background:#ddd;
        margin-top:15px;
        animation:shimmer 1.5s infinite;
    }

    /* 내용 자리 */
    .text{
        width:100%;
        height:15px;
        background:#ddd;
        margin-top:10px;
        animation:shimmer 1.5s infinite;
    }

    /* 밝기가 바뀌는 애니메이션 */
    @keyframes shimmer{
        0%{
            opacity:0.5;
        }

        50%{
            opacity:1;
        }

        100%{
            opacity:0.5;
        }
    }
    </style>
</head>
<body>
    <div class="card">
    <div class="image"></div>
    <div class="title"></div>
    <div class="text"></div>
</div>
</body>
</html>
